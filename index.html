<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Neighbourhood Plant Guy | Eco-Friendly Plant Care</title>
  <meta name="description" content="Eco-friendly plant care, pruning, pest management, and horticultural consulting in Bradford and York Region by Trevor Auton." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --primary: #2d6a4f;
      --primary-dark: #1b4332;
      --primary-light: #52b788;
      --accent: #ffb703;
      --accent-orange: #fb8500;
      --bg-cream: #fbf8f1;
      --dark: #1f2421;
      --comic-font: 'Bangers', cursive, sans-serif;
      --body-font: 'Outfit', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Main window doesn't scroll; frame scrolls seamlessly */
      font-family: var(--body-font);
      background-color: var(--bg-cream);
      display: flex;
      flex-direction: column;
    }

    /* Fixed Top Bar */
    .top-bar {
      background: var(--primary-dark);
      color: #fff;
      padding: 6px 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      border-bottom: 2px solid var(--accent);
      z-index: 100;
      flex-shrink: 0;
    }
    .top-bar-contact { display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap; }
    .top-bar-contact a { color: #fff; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .top-bar-contact a:hover { color: var(--accent); }
    .top-bar-socials { display: flex; gap: 0.8rem; }
    .top-bar-socials a {
      color: #fff; background: rgba(255,255,255,0.12); width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.25s;
    }
    .top-bar-socials a:hover { background: var(--accent); color: var(--dark); transform: scale(1.1); }

    /* Fixed Header */
    header {
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      z-index: 90;
      flex-shrink: 0;
    }
    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.6rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-logo { display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; }
    .brand-avatar {
      width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--accent); background: #fff; object-fit: cover;
    }
    .brand-title {
      font-family: var(--comic-font); font-size: 1.7rem; color: var(--primary-dark); text-shadow: 1px 1px 0 var(--accent); line-height: 1;
    }
    .brand-subtitle { font-size: 0.72rem; font-weight: 800; color: var(--accent-orange); letter-spacing: 1px; text-transform: uppercase; }

    nav { display: flex; gap: 0.3rem; align-items: center; }
    .nav-btn {
      background: transparent; border: none; padding: 0.5rem 0.85rem; font-family: var(--body-font);
      font-weight: 700; font-size: 0.92rem; color: var(--dark); border-radius: 20px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease; text-decoration: none;
    }
    .nav-btn:hover { background: rgba(82, 183, 136, 0.15); color: var(--primary-dark); }
    .nav-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(45, 106, 79, 0.3); }

    .mobile-menu-toggle { display: none; background: none; border: none; font-size: 1.6rem; color: var(--primary-dark); cursor: pointer; }

    /* Seamless Frame Container */
    #contentFrame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    /* Continuous Music Player */
    .floating-music-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(27, 67, 50, 0.95);
      backdrop-filter: blur(12px);
      border: 2px solid var(--accent);
      border-radius: 40px;
      padding: 8px 18px 8px 10px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }
    .vinyl-disc {
      width: 38px; height: 38px; border-radius: 50%; background: #111; border: 2px solid var(--accent);
      display: flex; align-items: center; justify-content: center; color: var(--accent);
      animation: spinDisc 3s linear infinite; animation-play-state: paused;
    }
    .vinyl-disc.playing { animation-play-state: running; }
    @keyframes spinDisc { 100% { transform: rotate(360deg); } }
    .music-info { display: flex; flex-direction: column; }
    .music-title { font-size: 0.8rem; font-weight: 700; color: var(--accent); }
    .music-sub { font-size: 0.68rem; opacity: 0.8; }
    .player-btn {
      background: #fff; border: none; color: var(--primary-dark); width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .vol-slider { width: 50px; accent-color: var(--accent); cursor: pointer; }

    @media (max-width: 900px) {
      .mobile-menu-toggle { display: block; }
      nav {
        position: fixed; top: 85px; left: 0; right: 0; background: #fff;
        flex-direction: column; padding: 1.2rem; box-shadow: 0 15px 30px rgba(0,0,0,0.15); display: none;
      }
      nav.open { display: flex; }
      .nav-btn { width: 100%; justify-content: center; }
      .top-bar-contact { font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-bar-contact">
      <a href="tel:9052527619"><i class="fa-solid fa-phone"></i> Office: 905-252-7619</a>
      <a href="tel:9052523569"><i class="fa-solid fa-mobile-screen"></i> Cell: 905-252-3569</a>
      <a href="mailto:YourNeighbourhoodPlantGuy@Gmail.com"><i class="fa-solid fa-envelope"></i> YourNeighbourhoodPlantGuy@Gmail.com</a>
    </div>
    <div class="top-bar-socials">
      <a href="https://www.youtube.com/@trevorauton2676" target="_blank" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
      <a href="https://www.tiktok.com/@your.neighbourhoo8" target="_blank" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
      <a href="https://www.threads.com/@yourneighbourhoodplantguy" target="_blank" title="Threads / Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://www.threads.com/@yourneighbourhoodplantguy" target="_blank" title="Threads"><i class="fa-brands fa-threads"></i></a>
      <a href="https://www.facebook.com" target="_blank" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
    </div>
  </div>

  <!-- Persistent Header -->
  <header>
    <div class="nav-container">
      <div class="brand-logo" onclick="loadPage('home.html', 'home')">
        <img id="siteBrandLogo" src="https://f005.backblazeb2.com/file/YourNeighbourhoodPlantGuyWebsite/PLANT%20GUY%20LOGO%20transparent.png" alt="Plant Guy Logo" class="brand-avatar" />
        <div>
          <div class="brand-title">Your Neighbourhood Plant Guy</div>
          <div class="brand-subtitle">Eco-Friendly Plant Care • 25 Yrs Experience</div>
        </div>
      </div>

      <button class="mobile-menu-toggle" onclick="toggleMobileNav()"><i class="fa-solid fa-bars"></i></button>

      <nav id="navMenu">
        <button class="nav-btn active" data-page="home" onclick="loadPage('home.html', 'home')"><i class="fa-solid fa-house"></i> Home</button>
        <button class="nav-btn" data-page="gallery" onclick="loadPage('gallery.html', 'gallery')"><i class="fa-solid fa-seedling"></i> Plant Gallery</button>
        <button class="nav-btn" data-page="jobs" onclick="loadPage('jobs.html', 'jobs')"><i class="fa-solid fa-tree"></i> Completed Jobs</button>
        <button class="nav-btn" data-page="videos" onclick="loadPage('videos.html', 'videos')"><i class="fa-solid fa-clapperboard"></i> Videos</button>
        <button class="nav-btn" data-page="comics" onclick="loadPage('comics.html', 'comics')"><i class="fa-solid fa-book-open"></i> Comics &amp; Posters</button>
        <button class="nav-btn" data-page="blog" onclick="loadPage('blog.html', 'blog')"><i class="fa-solid fa-newspaper"></i> Blog</button>
        <button class="nav-btn" data-page="quote" onclick="loadPage('quote.html', 'quote')"><i class="fa-solid fa-calculator"></i> Request Quote</button>
        <button class="nav-btn" data-page="contact" onclick="loadPage('contact.html', 'contact')"><i class="fa-solid fa-address-book"></i> Contact</button>
      </nav>
    </div>
  </header>

  <!-- Seamless Edge-to-Edge Frame -->
  <iframe id="contentFrame" name="contentFrame" src="home.html" title="Main Content"></iframe>

  <!-- Persistent Background Theme Song -->
  <audio id="themeAudio" loop preload="auto" src="https://f005.backblazeb2.com/file/YourNeighbourhoodPlantGuyWebsite/Your%20Neighbourhood%20Plant%20Guy.mp3"></audio>

  <!-- Music Widget -->
  <div class="floating-music-bar">
    <div class="vinyl-disc" id="vinylDisc"><i class="fa-solid fa-music"></i></div>
    <div class="music-info">
      <span class="music-title">Your Neighbourhood Plant Guy</span>
      <span class="music-sub">Official Theme Song 🎶</span>
    </div>
    <div class="music-controls">
      <button class="player-btn" onclick="toggleThemeSong()"><i class="fa-solid fa-play" id="playIcon"></i></button>
      <input type="range" class="vol-slider" min="0" max="1" step="0.05" value="0.7" onchange="adjustVolume(this.value)" />
    </div>
  </div>

  <script>
    function loadPage(pageUrl, pageKey) {
      document.getElementById('contentFrame').src = pageUrl;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.querySelector(`.nav-btn[data-page="${pageKey}"]`);
      if (activeBtn) activeBtn.classList.add('active');
      document.getElementById('navMenu').classList.remove('open');
      
      // Update browser history state for clean navigation
      if (window.history.pushState) {
        window.history.pushState({ page: pageKey }, '', `?page=${pageKey}`);
      }
    }

    function toggleMobileNav() {
      document.getElementById('navMenu').classList.toggle('open');
    }

    // Audio Controller
    const audio = document.getElementById('themeAudio');
    const playIcon = document.getElementById('playIcon');
    const disc = document.getElementById('vinylDisc');

    function toggleThemeSong() {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.className = 'fa-solid fa-pause';
          disc.classList.add('playing');
        }).catch(err => console.log('Click to start audio'));
      } else {
        audio.pause();
        playIcon.className = 'fa-solid fa-play';
        disc.classList.remove('playing');
      }
    }

    function adjustVolume(v) { audio.volume = parseFloat(v); }

    document.addEventListener('click', function startAudioOnce() {
      if (audio.paused && audio.currentTime === 0) {
        audio.volume = 0.6;
        audio.play().then(() => {
          playIcon.className = 'fa-solid fa-pause';
          disc.classList.add('playing');
        }).catch(() => {});
      }
      document.removeEventListener('click', startAudioOnce);
    }, { once: true });

    // Handle deep-linked query params e.g. index.html?page=blog
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const requested = params.get('page');
      if (requested && ['home', 'gallery', 'jobs', 'videos', 'comics', 'blog', 'quote', 'contact'].includes(requested)) {
        loadPage(`${requested}.html`, requested);
      }
    });
  </script>
</body>
</html>
